  <!-- Fontes hospedadas aqui mesmo (assets/fontes): nenhum domínio externo
       na carga da página. Só o subconjunto latino é pré-carregado; o
       latin-ext entra sob demanda pelo unicode-range em style.css. -->
  <link rel="preload" href="assets/fontes/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fontes/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />

  <!-- Preact e htm vêm de vendor/, mapeados para os nomes curtos que o
       código importa ('preact', 'preact/hooks', 'htm'). -->
  <script type="importmap">
    {
      "imports": {
        "preact": "./vendor/preact.module.js",
        "preact/hooks": "./vendor/hooks.module.js",
        "htm": "./vendor/htm.module.js"
      }
    }
  </script>

  <!-- Pré-carrega o grafo inteiro de módulos de uma vez, em vez de o
       navegador descobrir cada import só depois de baixar o anterior. -->
  <link rel="modulepreload" href="vendor/preact.module.js" />
  <link rel="modulepreload" href="vendor/hooks.module.js" />
  <link rel="modulepreload" href="vendor/htm.module.js" />
  <link rel="modulepreload" href="script.js" />
  <link rel="modulepreload" href="apps.js" />
  <link rel="modulepreload" href="data.js" />
  <link rel="modulepreload" href="icones.js" />
  <link rel="modulepreload" href="logos.js" />

  <script>
    // Aplica o tema salvo antes da primeira pintura (evita "flash" branco)
    try {
      var t = localStorage.getItem('ga-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
